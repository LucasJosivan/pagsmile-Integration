<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagsmile · Integration Tester</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo-pagsmile.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__brand">
      <div class="app-header__logo">
        <img src="assets/logo-pagsmile.svg" alt="Pagsmile" />
      </div>
      <span id="header-subtitle" class="app-header__subtitle">Integration Tester</span>
    </div>
    <div class="app-header__actions">
      <div class="lang-switch" id="lang-switch">
        <button type="button" class="lang-switch__btn" id="lang-pt-btn" data-lang="pt">PT</button>
        <button type="button" class="lang-switch__btn" id="lang-en-btn" data-lang="en">EN</button>
        <button type="button" class="lang-switch__btn" id="lang-zh-btn" data-lang="zh">中文</button>
      </div>
      <button id="reset-btn" class="btn btn-ghost btn-sm" type="button">Reset</button>
      <button id="creds-btn" class="btn btn-outline btn-sm" type="button">Credentials</button>
    </div>
  </header>

  <main class="workbench">
    <section class="workbench__form">
      <div id="form-column"></div>
      <div class="preview-card hints-card" id="hints-panel"></div>
    </section>

    <aside class="workbench__preview">
      <div class="preview-card">
        <div class="preview-card__header">
          <div>
            <h3 id="curl-title">cURL</h3>
            <p id="curl-subtitle" class="preview-card__subtitle"></p>
          </div>
          <button id="copy-curl-btn" class="btn btn-outline btn-sm" type="button">Copy</button>
        </div>
        <div class="request-info" id="request-info"></div>
        <pre id="curl-output" class="code-block code-block--preview"></pre>
      </div>

      <div class="preview-card">
        <div class="preview-card__header">
          <div>
            <h3 id="code-title">Ready-to-paste code</h3>
          </div>
          <button id="copy-code-btn" class="btn btn-outline btn-sm" type="button">Copy</button>
        </div>
        <div class="code-tabs" id="code-tabs">
          <button type="button" class="code-tab code-tab--active" data-lang="go">Go</button>
          <button type="button" class="code-tab" data-lang="node">Node.js</button>
          <button type="button" class="code-tab" data-lang="python">Python</button>
        </div>
        <pre id="code-output" class="code-block code-block--preview"></pre>
      </div>
    </aside>
  </main>

  <footer id="app-footer-text" class="app-footer"></footer>

  <dialog id="creds-dialog" class="creds-dialog">
    <div class="creds-dialog__inner">
      <div class="creds-dialog__header">
        <h3 id="creds-title">Credentials</h3>
        <button class="btn btn-ghost btn-sm" type="button" id="creds-close-btn">Close</button>
      </div>
      <div id="creds-body"></div>
    </div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
